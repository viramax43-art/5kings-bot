function CheckFullIMGS()
{

    if (((tmpPercent != curPercent || !jQuery('#downloadStatus').html()) && (tmpPercent < 100)) || (count == maxImgs))
    {
        curPercent = tmpPercent;

        jQuery('#downloadStatus').html(html);
    }
}

function getBase64Image(img) 
{
    var canvas = document.createElement("canvas");
    canvas.width = img.width;
    canvas.height = img.height;

    var ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);

    var dataURL = canvas.toDataURL("image/png");

    return dataURL.replace(/^data:image\/(png|jpg);base64,/, "");
}

function Load3DGraph()
{
    var fromBD = 1;
    var indexedDB = window.indexedDB || window.mozIndexedDB || window.webkitIndexedDB || window.msIndexedDB;
    var request = indexedDB.open(BattleBaseName, Battle_DBVersion);
    request.onerror = function() {
        console.log('DB onerror');
    };
    request.onsuccess = function(event){
        var db = event.target.result;
        db.onerror = function(event) { console.log('db onerror2'); };
        if (!AllreadyInRun) { AllreadyInRun = 1; LoadImgsFrom(db,fromBD,1); }
    };
    request.onupgradeneeded = function(event) {
        var db = event.target.result;
        if (db.objectStoreNames.contains(BattleStoreName)) {
            db.deleteObjectStore(BattleStoreName);
        }
        if (!db.objectStoreNames.contains(BattleStoreName)) { 
            db.createObjectStore(BattleStoreName); // создаём хранилище
        }
        fromBD = 0;
    };
}
